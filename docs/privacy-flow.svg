<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 276" width="960" height="276" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
