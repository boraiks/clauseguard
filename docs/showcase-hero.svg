<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="apple-shadow" x="-6%" y="-6%" width="114%" height="118%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1D1D1F" flood-opacity="0.06"/>
    </filter>
    <filter id="popup-shadow" x="-10%" y="-8%" width="122%" height="122%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#1D1D1F" flood-opacity="0.11"/>
    </filter>
  </defs>

  <!-- Studio Canvas -->
  <rect x="1" y="1" width="958" height="438" rx="20" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>

  <!-- Left: Formal Monochrome PDF Viewer Window -->
  <g filter="url(#apple-shadow)">
    <rect x="36" y="34" width="574" height="372" rx="12" fill="#EBEBEF" stroke="#D4D4D8" stroke-width="1.2"/>
  </g>
  <!-- Top Viewer Chrome -->
  <rect x="37" y="35" width="572" height="35" rx="11" fill="#FAFAFA"/>
  <rect x="37" y="54" width="572" height="16" fill="#FAFAFA"/>
  <line x1="36" y1="70" x2="610" y2="70" stroke="#DCDCE0" stroke-width="1"/>

  <!-- Monochrome Window Dots -->
  <circle cx="56" cy="52" r="5" fill="#D1D1D6"/>
  <circle cx="72" cy="52" r="5" fill="#D1D1D6"/>
  <circle cx="88" cy="52" r="5" fill="#D1D1D6"/>

  <!-- Monochrome Filename Pill -->
  <rect x="202" y="40" width="236" height="23" rx="6" fill="#F4F4F5" stroke="#E4E4E7" stroke-width="1"/>
  <text x="320" y="55.5" fill="#52525B" font-size="11" font-weight="500" text-anchor="middle">lease-agreement-2026.pdf</text>

  <!-- Toolbar Mini Monochrome Logo -->
  <rect x="508" y="41" width="22" height="22" rx="5" fill="#111111"/>
  <path d="M 514 45 H 520 L 524 49 V 52.5 C 524 55.5 521.5 57.5 519 58.5 C 516.5 57.5 514 55.5 514 52.5 V 45 Z" fill="#FFFFFF"/>
  <rect x="516" y="51.5" width="6" height="2" rx="1" fill="#71717A"/>

  <!-- Pure White Formal Legal Paper Sheet inside PDF Viewer -->
  <rect x="56" y="82" width="534" height="312" fill="#FFFFFF" stroke="#DCDCE0" stroke-width="1"/>

  <!-- Legal Serif Document Content (all lines stay cleanly <= 518px) -->
  <g font-family="Georgia, 'Times New Roman', Times, serif">
    <text x="299" y="108" fill="#111111" font-size="12" font-weight="700" letter-spacing="1.2" text-anchor="middle">RESIDENTIAL LEASE AGREEMENT</text>
    <line x1="80" y1="117" x2="518" y2="117" stroke="#111111" stroke-width="1.2"/>
    <line x1="80" y1="120" x2="518" y2="120" stroke="#A1A1AA" stroke-width="0.7"/>

    <text x="80" y="137" fill="#3F3F46" font-size="9.5">Lessor: M. Ornek   |   Lessee: A. Ornek   |   ID: 11111111110   |   IBAN: TR00 0000...</text>
    <line x1="80" y1="147" x2="518" y2="147" stroke="#E4E4E7" stroke-width="1"/>

    <text x="80" y="167" fill="#18181B" font-size="10">
      <tspan font-weight="700">1. Premises.</tspan> The leased property shall be used solely for residential purposes.
    </text>

    <text x="80" y="188" fill="#18181B" font-size="10">
      <tspan font-weight="700">2. Rent &amp; Payment.</tspan> Monthly rent is payable on the first business day of each month.
    </text>

    <!-- Clause 3: Subtle Monochrome Ink Highlight + Thin Crimson Underline -->
    <rect x="76" y="213" width="446" height="42" rx="3" fill="#F1F1F3"/>
    <text x="80" y="227" fill="#18181B" font-size="10">
      <tspan font-weight="700">3. Early Termination.</tspan> Should the Lessee vacate prior to term expiration,
    </text>
    <line x1="188" y1="231" x2="408" y2="231" stroke="#B91C1C" stroke-width="1.2"/>
    <text x="80" y="244" fill="#18181B" font-size="10">all remaining monthly installments shall become immediately due as liquidated damages.</text>
    <line x1="80" y1="248" x2="462" y2="248" stroke="#B91C1C" stroke-width="1.2"/>

    <!-- Clause 4: Plain Formal B&W Text with Muted Gray Hairline Underline -->
    <text x="80" y="276" fill="#18181B" font-size="10">
      <tspan font-weight="700">4. Eviction Undertaking.</tspan> Lessee agrees to execute an undated eviction
    </text>
    <line x1="205" y1="280" x2="398" y2="280" stroke="#A1A1AA" stroke-width="1"/>
    <text x="80" y="293" fill="#18181B" font-size="10">undertaking upon signing of this agreement.</text>
    <line x1="80" y1="297" x2="269" y2="297" stroke="#A1A1AA" stroke-width="1"/>

    <text x="80" y="320" fill="#18181B" font-size="10">
      <tspan font-weight="700">5. Utilities &amp; Dues.</tspan> Electricity, water, gas, and building dues shall be borne by
    </text>
    <text x="80" y="335" fill="#18181B" font-size="10">the Lessee throughout the lease term.</text>

    <text x="299" y="376" fill="#A1A1AA" font-size="8.5" text-anchor="middle">Page 1 of 4  -  Standard Form Lease</text>
  </g>

  <!-- Right/Front: Restrained Monochrome ClauseGuard Extension Popup -->
  <g filter="url(#popup-shadow)">
    <rect x="548" y="54" width="376" height="332" rx="14" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1.2"/>
  </g>

  <!-- Popup Header -->
  <rect x="568" y="70" width="24" height="24" rx="6" fill="#111111"/>
  <path d="M 575 75 H 581.5 L 585.5 79 V 83 C 585.5 86 582.8 88 580 89 C 577.2 88 574.5 86 574.5 83 V 75.5 Z" fill="#FFFFFF"/>
  <rect x="577" y="82" width="6" height="2" rx="1" fill="#71717A"/>
  <text x="600" y="87" fill="#111111" font-size="14" font-weight="700">ClauseGuard</text>

  <rect x="766" y="70" width="138" height="24" rx="12" fill="#F4F4F5" stroke="#E4E4E7" stroke-width="1"/>
  <circle cx="780" cy="82" r="3" fill="#1D8A4E"/>
  <text x="841" y="86" fill="#18181B" font-size="10.5" font-weight="600" text-anchor="middle">Offline &#183; 0 bytes sent</text>

  <!-- Privacy Masking Bar -->
  <rect x="568" y="108" width="336" height="34" rx="8" fill="#F4F4F5"/>
  <text x="578" y="129" fill="#52525B" font-size="10.5" font-weight="600">Masked:</text>
  <rect x="628" y="115" width="106" height="20" rx="4" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1"/>
  <text x="681" y="129" fill="#18181B" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">[REDACTED_ID]</text>
  <rect x="742" y="115" width="116" height="20" rx="4" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1"/>
  <text x="800" y="129" fill="#18181B" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">[REDACTED_IBAN]</text>

  <!-- Flagged Clause Card -->
  <rect x="568" y="154" width="336" height="188" rx="10" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.2"/>
  <circle cx="587" cy="176" r="3" fill="#B91C1C"/>
  <text x="596" y="180" fill="#B91C1C" font-size="9.5" font-weight="700" letter-spacing="0.4">HIGH RISK</text>
  <text x="658" y="180" fill="#111111" font-size="11.5" font-weight="700">Section 3 - Early Exit Penalty</text>
  <text x="582" y="204" fill="#52525B" font-size="10.5">Leaving 6 months early still costs 6 full months of rent.</text>

  <line x1="582" y1="218" x2="890" y2="218" stroke="#E4E4E7" stroke-width="1"/>
  <text x="582" y="234" fill="#52525B" font-size="9.5" font-weight="700" letter-spacing="0.6">SUGGESTED COUNTER-CLAUSE</text>

  <rect x="582" y="242" width="308" height="44" rx="6" fill="#F4F4F5"/>
  <text x="592" y="259" fill="#18181B" font-size="10">"Lessee may terminate early with 60 days prior</text>
  <text x="592" y="275" fill="#18181B" font-size="10">written notice without financial penalty."</text>

  <!-- Restrained Monochrome Action Buttons -->
  <rect x="582" y="298" width="176" height="30" rx="7" fill="#111111"/>
  <text x="670" y="317" fill="#FFFFFF" font-size="11" font-weight="600" text-anchor="middle">Copy Counter-Clause</text>

  <rect x="768" y="298" width="122" height="30" rx="7" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1"/>
  <text x="829" y="317" fill="#111111" font-size="11" font-weight="600" text-anchor="middle">Edit Before AI</text>

  <!-- Popup Footer -->
  <text x="736" y="366" fill="#71717A" font-size="10" text-anchor="middle">Rule Pack: TR Lease (6 rules) &#183; 100% On-Device</text>
</svg>
