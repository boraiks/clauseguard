<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 392" width="960" height="392" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0071E3"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1D8A4E"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#86868B"/>
    </marker>
  </defs>

  <!-- Outer Canvas -->
  <rect x="1" y="1" width="958" height="390" rx="20" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>

  <!-- Header -->
  <text x="28" y="38" fill="#1D1D1F" font-size="16" font-weight="700">ClauseGuard Architecture - Zero-Backend Chrome Extension</text>
  <rect x="708" y="18" width="224" height="28" rx="14" fill="#EAF7F0" stroke="#1D8A4E" stroke-width="1"/>
  <text x="820" y="36" fill="#1D8A4E" font-size="12" font-weight="600" text-anchor="middle">100% On-Device Privacy Core</text>

  <!-- Column 1: Input -->
  <rect x="24" y="66" width="176" height="302" rx="12" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1.2"/>
  <text x="112" y="90" fill="#6E6E73" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">1. INPUT</text>

  <rect x="38" y="112" width="148" height="96" rx="8" fill="#F5F5F7" stroke="#0071E3" stroke-width="1.2"/>
  <text x="112" y="142" fill="#1D1D1F" font-size="13" font-weight="700" text-anchor="middle">Active Web Page</text>
  <text x="112" y="164" fill="#6E6E73" font-size="11" text-anchor="middle">ToS &amp; Privacy Policy</text>
  <text x="112" y="184" fill="#0071E3" font-size="11" font-weight="600" text-anchor="middle">1-Click Tab Read</text>

  <rect x="38" y="236" width="148" height="96" rx="8" fill="#F5F5F7" stroke="#0071E3" stroke-width="1.2"/>
  <text x="112" y="266" fill="#1D1D1F" font-size="13" font-weight="700" text-anchor="middle">Contract Text / PDF</text>
  <text x="112" y="288" fill="#6E6E73" font-size="11" text-anchor="middle">Lease, Freelance, Intern</text>
  <text x="112" y="308" fill="#0071E3" font-size="11" font-weight="600" text-anchor="middle">Paste or Local PDF</text>

  <!-- Arrows Col 1 -> Col 2 -->
  <path d="M 186 160 L 214 160 L 214 138 L 246 138" fill="none" stroke="#0071E3" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <path d="M 186 284 L 214 284 L 214 138" fill="none" stroke="#0071E3" stroke-width="1.6"/>

  <!-- Column 2: Local Sandbox -->
  <rect x="236" y="66" width="254" height="302" rx="12" fill="#EAF7F0" stroke="#1D8A4E" stroke-width="1.5"/>
  <text x="363" y="90" fill="#1D8A4E" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.8">2. LOCAL SANDBOX (OFFLINE)</text>

  <rect x="250" y="106" width="226" height="64" rx="8" fill="#FFFFFF" stroke="#1D8A4E" stroke-width="1.2"/>
  <text x="363" y="131" fill="#1D1D1F" font-size="13" font-weight="700" text-anchor="middle">Auto PII Scrubber</text>
  <text x="363" y="151" fill="#6E6E73" font-size="11" text-anchor="middle">Regex: TCKN, IBAN, Phone, Email</text>

  <line x1="363" y1="170" x2="363" y2="192" stroke="#1D8A4E" stroke-width="1.6" marker-end="url(#arrow-green)"/>

  <rect x="250" y="196" width="226" height="64" rx="8" fill="#FFFFFF" stroke="#1D8A4E" stroke-width="1.2"/>
  <text x="363" y="221" fill="#1D1D1F" font-size="13" font-weight="700" text-anchor="middle">Rule Pack Slicer</text>
  <text x="363" y="241" fill="#6E6E73" font-size="11" text-anchor="middle">JSON Packs: TR Kira, Freelance, ToS</text>

  <line x1="363" y1="260" x2="363" y2="282" stroke="#1D8A4E" stroke-width="1.6" marker-end="url(#arrow-green)"/>

  <rect x="250" y="286" width="226" height="66" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.4"/>
  <text x="363" y="311" fill="#B45309" font-size="13" font-weight="700" text-anchor="middle">Editable Privacy Preview</text>
  <text x="363" y="331" fill="#6E6E73" font-size="11" text-anchor="middle">Manual 2-sec check before any AI</text>

  <!-- Arrows Col 2 -> Col 3 -->
  <path d="M 476 310 L 504 310 L 504 120 L 522 120" fill="none" stroke="#1D8A4E" stroke-width="1.6" marker-end="url(#arrow-green)"/>
  <path d="M 476 328 L 508 328 L 508 281 L 522 281" fill="none" stroke="#0071E3" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrow-blue)"/>

  <!-- Column 3: Offline & Optional AI -->
  <rect x="526" y="66" width="206" height="108" rx="12" fill="#1D8A4E"/>
  <text x="629" y="94" fill="#EAF7F0" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.8">OFFLINE RADAR MODE</text>
  <text x="629" y="122" fill="#FFFFFF" font-size="13.5" font-weight="700" text-anchor="middle">0 Bytes Sent Externally</text>
  <text x="629" y="146" fill="#EAF7F0" font-size="11" text-anchor="middle">Instant Local Rule Hints</text>

  <rect x="526" y="194" width="206" height="174" rx="12" fill="#EDF4FC" stroke="#0071E3" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="629" y="218" fill="#0071E3" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.8">3. OPTIONAL AI LAYER</text>

  <rect x="540" y="232" width="178" height="56" rx="8" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/>
  <text x="629" y="254" fill="#1D1D1F" font-size="12" font-weight="700" text-anchor="middle">v0.1: BYOK (Direct)</text>
  <text x="629" y="272" fill="#6E6E73" font-size="10.5" text-anchor="middle">Groq / Gemini in local storage</text>

  <rect x="540" y="300" width="178" height="56" rx="8" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="629" y="322" fill="#1D1D1F" font-size="12" font-weight="700" text-anchor="middle">v0.2: Free Proxy</text>
  <text x="629" y="340" fill="#6E6E73" font-size="10.5" text-anchor="middle">Cloudflare Worker + Rate Limit</text>

  <!-- Arrows Col 3 -> Col 4 -->
  <path d="M 732 120 L 750 120 L 750 144 L 764 144" fill="none" stroke="#1D8A4E" stroke-width="1.6" marker-end="url(#arrow-green)"/>
  <path d="M 732 281 L 750 281 L 750 232 L 764 232" fill="none" stroke="#0071E3" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrow-blue)"/>

  <!-- Column 4: Output -->
  <rect x="768" y="66" width="168" height="302" rx="12" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1.2"/>
  <text x="852" y="90" fill="#6E6E73" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">4. OUTPUT</text>

  <rect x="780" y="108" width="144" height="74" rx="8" fill="#F5F5F7" stroke="#D93025" stroke-width="1.2"/>
  <text x="852" y="138" fill="#1D1D1F" font-size="12.5" font-weight="700" text-anchor="middle">Flagged Clauses</text>
  <text x="852" y="158" fill="#D93025" font-size="11" font-weight="600" text-anchor="middle">Exact quote + severity</text>

  <rect x="780" y="196" width="144" height="74" rx="8" fill="#F5F5F7" stroke="#B45309" stroke-width="1.2"/>
  <text x="852" y="226" fill="#1D1D1F" font-size="12.5" font-weight="700" text-anchor="middle">Worst-Case</text>
  <text x="852" y="246" fill="#B45309" font-size="11" font-weight="600" text-anchor="middle">Plain 1-line impact</text>

  <rect x="780" y="284" width="144" height="74" rx="8" fill="#F5F5F7" stroke="#0071E3" stroke-width="1.2"/>
  <text x="852" y="314" fill="#1D1D1F" font-size="12.5" font-weight="700" text-anchor="middle">Counter-Clause</text>
  <text x="852" y="334" fill="#0071E3" font-size="11" font-weight="600" text-anchor="middle">1-click copy reply</text>
</svg>
